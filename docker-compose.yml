# Production docker-compose file for Matrix stack
# This configuration:
# - Uses real domain names with Let's Encrypt SSL certificates
# - Makes Authelia optional (use --profile authelia to enable)
# - Makes Caddy optional (use --profile single-machine for all-in-one deployment)
# - Configures all services for production use
#
# Deployment Modes:
# 1. Multi-machine (default): docker compose -f docker-compose.production.yml up -d
#    - Runs: Synapse, MAS, Element, PostgreSQL only
#    - Caddy and Authelia run on separate machines
# 2. Single-machine with Authelia: docker compose -f docker-compose.production.yml --profile single-machine --profile authelia up -d
#    - Runs everything on one machine with Caddy + Authelia
# 3. Single-machine without Authelia: docker compose -f docker-compose.production.yml --profile single-machine up -d
#    - Runs everything on one machine with Caddy, no Authelia

services:
  # PostgreSQL Database
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: matrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - matrix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Matrix Synapse Server
  synapse:
    build:
      context: .
      dockerfile: synapse/Dockerfile
      args:
        SYNAPSE_IMAGE: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    image: matrix-synapse:local
    container_name: matrix-synapse
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data
    volumes:
      - ./synapse/data:/data
      - ./bridges:/bridges:ro
      - ./appservices:/appservices:ro
    # Ports published to host for multi-machine deployment
    ports:
      - "8008:8008"
      - "8448:8448"  # Federation port
    networks:
      - matrix-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Element Web Client
  element:
    image: ${ELEMENT_IMAGE:-vectorim/element-web:latest}
    container_name: matrix-element
    restart: unless-stopped
    volumes:
      - ./element/config/config.json:/app/config.json:ro
    # Port published to host for multi-machine deployment
    ports:
      - "8090:80"  # Map container port 80 to host port 8090
    networks:
      - matrix-network
    depends_on:
      - synapse

  # Ketesa - Web UI for managing users/rooms via Synapse Admin API
  ketesa:
    image: ${KETESA_IMAGE:-etkecc/ketesa:latest}
    container_name: matrix-ketesa
    restart: unless-stopped
    # Port published to host for multi-machine deployment
    ports:
      - "8091:8080"
    networks:
      - matrix-network
    depends_on:
      - synapse

  # FluffyChat - alternative Matrix web client
  fluffychat:
    image: ${FLUFFYCHAT_IMAGE:-ghcr.io/krille-chan/fluffychat:latest}
    container_name: matrix-fluffychat
    restart: unless-stopped
    volumes:
      - ./fluffychat/config.json:/usr/share/nginx/html/config.json:ro
    # Port published to host for multi-machine deployment
    ports:
      - "8092:80"
    networks:
      - matrix-network
    depends_on:
      - synapse
    profiles:
      - fluffychat

  # Redis for Authelia session storage
  redis:
    profiles:
      - authelia  # Only started when Authelia profile is active
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: matrix-redis
    restart: unless-stopped
    networks:
      - matrix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Matrix Authentication Service (MAS)
  mas:
    image: ${MAS_IMAGE:-ghcr.io/element-hq/matrix-authentication-service:latest}
    container_name: matrix-mas
    restart: unless-stopped
    environment:
      MAS_CONFIG: /config/config.yaml
    volumes:
      - ./mas/config:/config:ro
      - ./mas/data:/data
    # Ports published to host for multi-machine deployment
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - matrix-network
    depends_on:
      postgres:
        condition: service_healthy

  # mautrix-discord Bridge (Go megabridge)
  mautrix-discord:
    image: ${DISCORD_IMAGE:-dock.mau.dev/mautrix/discord:latest}
    container_name: matrix-bridge-discord
    restart: unless-stopped
    volumes:
      - ./bridges/discord/config:/data
    networks:
      - matrix-network
    depends_on:
      synapse:
        condition: service_healthy

  # mautrix-slack Bridge (Go megabridge — Megaslack)
  mautrix-slack:
    image: ${SLACK_IMAGE:-dock.mau.dev/mautrix/slack:latest}
    container_name: matrix-bridge-slack
    restart: unless-stopped
    volumes:
      - ./bridges/slack/config:/data
    networks:
      - matrix-network
    depends_on:
      synapse:
        condition: service_healthy

  # matrix-hookshot — connects rooms to GitHub, GitLab, JIRA, RSS, and generic webhooks
  hookshot:
    profiles:
      - hookshot
    image: ${HOOKSHOT_IMAGE:-ghcr.io/matrix-org/matrix-hookshot:latest}
    container_name: matrix-hookshot
    restart: unless-stopped
    volumes:
      - ./hookshot:/data
    networks:
      - matrix-network
    depends_on:
      synapse:
        condition: service_healthy

  # synapse_auto_compressor — continuously compresses state_groups_state to reduce DB bloat
  synapse-auto-compressor:
    build:
      context: .
      dockerfile: synapse_auto_compressor/Dockerfile
    image: matrix-auto-compressor:local
    container_name: matrix-auto-compressor
    restart: unless-stopped
    environment:
      RUST_LOG: info
    command:
      - --db-url
      - postgresql://synapse:${POSTGRES_PASSWORD}@postgres/synapse
      - --chunk-size
      - "500"
    networks:
      - matrix-network
    depends_on:
      postgres:
        condition: service_healthy

  # Prometheus — scrapes Synapse metrics
  prometheus:
    profiles:
      - monitoring
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: matrix-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    networks:
      - matrix-network

  # Grafana — metrics dashboard (import Synapse dashboard ID 10046 from grafana.com)
  grafana:
    profiles:
      - monitoring
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: matrix-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://${MONITORING_DOMAIN:-monitoring.localhost}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - matrix-network
    depends_on:
      - prometheus

  # mautrix-telegram Bridge
  mautrix-telegram:
    image: ${TELEGRAM_IMAGE:-dock.mau.dev/mautrix/telegram:latest}
    container_name: matrix-bridge-telegram
    restart: unless-stopped
    volumes:
      - ./bridges/telegram/config:/data
    networks:
      - matrix-network
    depends_on:
      synapse:
        condition: service_healthy

  # mautrix-whatsapp Bridge
  mautrix-whatsapp:
    image: ${WHATSAPP_IMAGE:-dock.mau.dev/mautrix/whatsapp:latest}
    container_name: matrix-bridge-whatsapp
    restart: unless-stopped
    volumes:
      - ./bridges/whatsapp/config:/data
    networks:
      - matrix-network
    depends_on:
      synapse:
        condition: service_healthy

  # mautrix-signal Bridge
  mautrix-signal:
    image: ${SIGNAL_IMAGE:-dock.mau.dev/mautrix/signal:latest}
    container_name: matrix-bridge-signal
    restart: unless-stopped
    volumes:
      - ./bridges/signal/config:/data
    networks:
      - matrix-network
    depends_on:
      synapse:
        condition: service_healthy

  # LiveKit SFU — media server for Element Call (Optional - use profile "element-call" to enable)
  livekit:
    profiles:
      - element-call
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
    container_name: matrix-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "50100-50200:50100-50200/udp"
    volumes:
      - ./livekit/livekit.yaml:/livekit.yaml
    command: --config /livekit.yaml
    networks:
      - matrix-network

  # LiveKit JWT Service — issues LiveKit tokens to authenticated Matrix users
  lk-jwt-service:
    profiles:
      - element-call
    image: ${LK_JWT_IMAGE:-ghcr.io/element-hq/lk-jwt-service:latest}
    container_name: matrix-lk-jwt
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - LIVEKIT_URL=wss://${RTC_DOMAIN}/livekit/sfu
      - LIVEKIT_KEY=livekit-key
      - LIVEKIT_SECRET=${LIVEKIT_SECRET}
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=${MATRIX_DOMAIN}
    networks:
      - matrix-network
    depends_on:
      - livekit

  # Element Call frontend — self-hosted web app for video/voice calls
  # Reads livekit_service_url from .well-known/matrix/client (rtc_foci) automatically.
  # No extra configuration needed: homeserver details are passed as URL params by Element Web.
  element-call:
    profiles:
      - element-call
    image: ${ELEMENT_CALL_IMAGE:-ghcr.io/element-hq/element-call:latest}
    container_name: matrix-element-call
    restart: unless-stopped
    ports:
      - "8083:8080"
    networks:
      - matrix-network

  # Authelia SSO (Optional - use profile "authelia" to enable)
  authelia:
    profiles:
      - authelia  # Only started when Authelia profile is active
    image: ${AUTHELIA_IMAGE:-authelia/authelia:latest}
    container_name: matrix-authelia
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./authelia/config:/config
    # Accessed via Caddy
    expose:
      - "9091"
    networks:
      - matrix-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Caddy Reverse Proxy (HTTPS termination with Let's Encrypt)
  # For multi-machine deployments: Don't use this profile (Caddy runs separately)
  # For single-machine deployments: Use --profile single-machine
  caddy:
    profiles:
      - single-machine  # Only started for single-machine deployments
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: matrix-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
      - "2019:2019"  # Admin API
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - matrix-network
    depends_on:
      - synapse
      - element
      - mas
      # Note: Authelia dependency removed - works with or without Authelia

networks:
  matrix-network:
    driver: bridge

volumes:
  postgres-data:
  synapse-data:
  mas-data:
  prometheus-data:
  grafana-data:
